spring:
  datasource:
    url: jdbc:h2:mem:ewm;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      # только портируемая часть схемы — PL/pgSQL функция distance() из
      # schema-postgres.sql на H2 не выполнится, поиск событий в радиусе
      # локации проверяется Postman-коллекцией, не этим профилем
      schema-locations:
        - classpath:schema.sql

stats-server:
  url: http://localhost:9090
